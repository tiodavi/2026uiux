<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>範例_圖片瀏覽 模板實作 (自動輪播版)</title>
    <style>
        /* 居中畫布背景 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9e9e9;
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* 📱 模擬手機外殼 */
        .phone-template {
            width: 280px;
            background-color: #ffffff;
            border: 3px solid #0091ff; 
            border-radius: 8px;
            padding: 24px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* Top Bar 黑色頂部區塊 */
        .top-bar {
            width: 140px;
            height: 16px;
            background-color: #32363a;
            border-radius: 2px;
        }

        /* 輪播圖核心區塊 */
        .carousel-view {
            width: 100%;
            overflow: hidden; 
            position: relative;
        }

        .image-stage {
            display: flex;
            width: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
            cursor: grab;
        }
        .image-stage:active {
            cursor: grabbing;
        }

        .food-wrapper {
            flex: 0 0 100%;
            box-sizing: border-box;
            padding-right: 12px; 
            transition: opacity 0.4s;
            opacity: 0.4; 
        }

        .food-wrapper.active {
            opacity: 1; 
        }

        .food-wrapper img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            pointer-events: none; 
        }

        /* 分頁指示點 */
        .page-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background-color: #d1d5db;
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .dot.active {
            background-color: #374151; 
        }

        /* 文字預留線條與底部按鈕區 */
        .text-placeholder {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 5px;
        }

        .line {
            height: 6px;
            background-color: #9ca3af;
            border-radius: 2px;
        }
        .line.title { width: 70%; height: 8px; background-color: #9499a6; margin-bottom: 4px;}
        .line.l1 { width: 100%; background-color: #cbd5e1; }
        .line.l2 { width: 75%; background-color: #cbd5e1; }
        .line.l3 { width: 85%; background-color: #cbd5e1; }

        /* 底部行動列 */
        .footer-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .footer-line {
            width: 45%;
            height: 6px;
            background-color: #cbd5e1;
            border-radius: 2px;
        }

        .btn-goto {
            background-color: #f7943e; 
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-goto:hover {
            background-color: #e27f29;
        }
    </style>
</head>
<body>

    <div class="phone-template">
        <div class="top-bar"></div>

        <div class="carousel-view">
            <div class="image-stage" id="imageStage">
                <div class="food-wrapper active">
                    <img src="https://images.unsplash.com/photo-1501443762994-82bd5dace89a?w=400" alt="冰淇淋1">
                </div>
                <div class="food-wrapper">
                    <img src="https://images.unsplash.com/photo-1497034825429-c343d7c6a68f?w=400" alt="冰淇淋2">
                </div>
                <div class="food-wrapper">
                    <img src="https://images.unsplash.com/photo-1576506295286-5cda18df43e7?w=400" alt="冰淇淋3">
                </div>
            </div>

            <div class="page-dots">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <div class="text-placeholder">
            <div class="line title"></div>
            <div class="line l1"></div>
            <div class="line l2"></div>
            <div class="line l3"></div>
        </div>

        <div class="footer-action">
            <div class="footer-line"></div>
            <button class="btn-goto">Let's go</button>
        </div>

    </div>

    <script>
        const stage = document.getElementById('imageStage');
        const wrappers = document.querySelectorAll('.food-wrapper');
        const dots = document.querySelectorAll('.dot');
        
        let currentIndex = 0;
        let isDragging = false;
        let startX = 0;
        let dragOffset = 0;
        let autoPlayTimer = null; // 儲存定時器的變數

        function goToSlide(index) {
            currentIndex = index;
            stage.style.transform = `translateX(-${currentIndex * 100}%)`;
            
            wrappers.forEach((w, i) => {
                if(i === currentIndex) w.classList.add('active');
                else w.classList.remove('active');
            });

            dots.forEach((d, i) => {
                if(i === currentIndex) d.classList.add('active');
                else d.classList.remove('active');
            });
        }

        // --- 新增：自動輪播邏輯 ---
        function startAutoPlay() {
            // 每 3000 毫秒 (3秒) 執行一次
            autoPlayTimer = setInterval(() => {
                // 計算下一張的 index，如果到最後一張就回到第 0 張
                let nextIndex = (currentIndex + 1) % wrappers.length;
                goToSlide(nextIndex);
            }, 3000);
        }

        function stopAutoPlay() {
            if (autoPlayTimer) {
                clearInterval(autoPlayTimer);
            }
        }
        // ------------------------

        function startDrag(e) {
            stopAutoPlay(); // 🛑 使用者開始拖曳時，停止自動輪播
            isDragging = true;
            startX = e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
            stage.style.transition = 'none';
        }

        function mouseDrag(e) {
            if (!isDragging) return;
            const currentX = e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
            dragOffset = currentX - startX;
            
            const baseLeft = -currentIndex * stage.offsetWidth;
            stage.style.transform = `translateX(${baseLeft + dragOffset}px)`;
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            stage.style.transition = 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)';

            if (dragOffset < -50 && currentIndex < wrappers.length - 1) {
                currentIndex++;
            } else if (dragOffset > 50 && currentIndex > 0) {
                currentIndex--;
            }
            
            goToSlide(currentIndex);
            dragOffset = 0;
            
            startAutoPlay(); // 🔄 使用者放開滑鼠/手指後，重啟自動輪播計時
        }

        // 綁定事件
        stage.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', mouseDrag);
        window.addEventListener('mouseup', endDrag);

        stage.addEventListener('touchstart', startDrag);
        stage.addEventListener('touchmove', mouseDrag);
        stage.addEventListener('touchend', endDrag);

        // 🚀 網頁載入完成後，初始化自動輪播
        startAutoPlay();
    </script>
</body>
</html>
