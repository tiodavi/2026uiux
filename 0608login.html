<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛玻璃極致自定義面板 - 附數值導出功能</title>
    <style>
        /* ==========================================
           1. 基礎核心樣式與預設變數
           ========================================== */
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920');
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-blur: 20px;
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: rgba(0, 0, 0, 0.2);
            --text-color: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --input-border: rgba(255, 255, 255, 0.4);
            --btn-bg: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            padding-left: 320px;
            transition: background-image 0.5s ease;
        }

        /* ==========================================
           2. 控制面板樣式 (左側側邊欄)
           ========================================== */
        .control-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100vh;
            background: rgba(20, 20, 20, 0.95);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            color: #fff;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .control-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            color: #007bff;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 8px;
        }

        .control-group label span {
            float: right;
            color: #007bff;
            font-weight: bold;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: #007bff;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 35px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
        }

        .control-group select {
            width: 100%;
            padding: 10px;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        /* 導出按鈕樣式 */
        .export-btn {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .export-btn:hover {
            background: #218838;
        }

        /* ==========================================
           3. 彈出視窗樣式 (Modal)
           ========================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 12px;
            width: 450px;
            padding: 25px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-box h4 {
            margin-bottom: 15px;
            font-size: 1.2rem;
            color: #28a745;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-modal {
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-modal:hover {
            color: #fff;
        }

        /* 程式碼顯示區域 */
        .code-block {
            background: #121212;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #a9ffb4;
            overflow-x: auto;
            white-space: pre-wrap;
            border: 1px solid #333;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
        }

        .copy-btn {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .copy-btn:hover {
            background: #0069d9;
        }

        /* ==========================================
           4. 登入主畫面結構
           ========================================== */
        .main-container {
            width: 90%;
            max-width: 900px;
            min-height: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3rem;
            
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 20px 50px var(--glass-shadow);
            
            color: var(--text-color);
        }

        .content-section {
            flex: 1;
            padding-right: 2rem;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 2.5rem;
        }

        .content-section h1 {
            font-size: 2.8rem;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        .content-section p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .login-card {
            width: 340px;
            padding: 2.5rem 2rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        .login-card h2 {
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: transparent;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-color);
            outline: none;
        }

        .input-group input::placeholder {
            color: var(--text-muted);
        }

        .forgot-link {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .submit-btn {
            width: 100%;
            padding: 0.8rem;
            background: var(--btn-bg);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <h3>毛玻璃自定義面板</h3>

        <div class="control-group">
            <label>1. 選擇背景底圖 (15款)</label>
            <select id="bgSelect" onchange="updateBg(this.value)">
                <optgroup label="✨ 流線 & 幾何">
                    <option value="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920">01. 絲綢白流線</option>
                    <option value="https://images.unsplash.com/photo-1614064641938-3bbee52942c7?q=80&w=1920">02. 暗黑科技幾何</option>
                    <option value="https://images.unsplash.com/photo-1502239608882-93b729c6af43?q=80&w=1920">03. 金屬絲滑灰</option>
                </optgroup>
                <optgroup label="🎨 炫彩 & 流體">
                    <option value="https://images.unsplash.com/photo-1557672172-298e090bd0f1?q=80&w=1920">04. 夢幻炫彩流體</option>
                    <option value="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?q=80&w=1920">05. 3D 霓虹波浪</option>
                    <option value="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1920">06. 漸層彩虹微光</option>
                </optgroup>
                <optgroup label="🌌 大自然 & 星空">
                    <option value="https://images.unsplash.com/photo-1531366936337-7c912a4589a7?q=80&w=1920">07. 挪威極光冰川</option>
                    <option value="https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?q=80&w=1920">08. 深空繁星銀河</option>
                    <option value="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920">09. 黃昏暮色海灘</option>
                </optgroup>
                <optgroup label="🏢 現代建築 & 工業風">
                    <option value="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1920">10. 明亮現代光影</option>
                    <option value="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1920">11. 都市玻璃大樓</option>
                    <option value="https://images.unsplash.com/photo-1541888946425-d81bb19240f5?q=80&w=1920">12. 清水模混凝土</option>
                </optgroup>
                <optgroup label="🌸 唯美 & 抽象">
                    <option value="https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17?q=80&w=1920">13. 抽象水彩暈染</option>
                    <option value="https://images.unsplash.com/photo-1490750967868-88aa4486c946?q=80&w=1920">14. 春日朦朧繁花</option>
                    <option value="https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1920">15. 綠意光影植物</option>
                </optgroup>
            </select>
        </div>

        <div class="control-group">
            <label>2. 磨砂模糊度 (Blur): <span id="blurVal">20px</span></label>
            <input type="range" id="blurInput" min="0" max="50" value="20" oninput="updateGlass()">
        </div>

        <div class="control-group">
            <label>3. 玻璃基調顏色</label>
            <input type="color" id="bgColorInput" value="#ffffff" oninput="updateGlass()">
        </div>
        <div class="control-group">
            <label>4. 玻璃透明度 (Opacity): <span id="opacityVal">0.06</span></label>
            <input type="range" id="opacityInput" min="0" max="1" step="0.01" value="0.06" oninput="updateGlass()">
        </div>

        <div class="control-group">
            <label>5. 邊框反光亮度 (Border Alpha): <span id="borderVal">0.15</span></label>
            <input type="range" id="borderInput" min="0" max="1" step="0.01" value="0.15" oninput="updateGlass()">
        </div>

        <div class="control-group">
            <label>6. 主文字顏色</label>
            <input type="color" id="textColorInput" value="#ffffff" oninput="updateText()">
        </div>

        <div class="control-group">
            <label>7. Submit按鈕顏色</label>
            <input type="color" id="btnColorInput" value="#000000" oninput="updateBtn()">
        </div>

        <hr style="border-color: #444; margin: 20px 0;">

        <button class="export-btn" onclick="openExportModal()">📥 導出當前改動數值</button>
    </div>

    <div class="main-container">
        <div class="content-section">
            <div class="brand">Brand Name</div>
            <h1>Malesuada<br>Fermentum<br>Tortor</h1>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
        </div>

        <div class="login-card">
            <h2>Login</h2>
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                </div>
                <a href="#" class="forgot-link">Forgot password ?</a>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="exportModal">
        <div class="modal-box">
            <h4>
                <span>📋 當前客製化 CSS 變數</span>
                <button class="close-modal" onclick="closeExportModal()">&times;</button>
            </h4>
            <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 10px;">您可以直接將下方代碼複製到您專案的 :root 中：</p>
            <div class="code-block" id="codeOutput"></div>
            <button class="copy-btn" id="copyBtn" onclick="copyToClipboard()">複製到剪貼簿</button>
        </div>
    </div>

    <script>
        // 記錄目前的各項數值狀態 (初始值)
        let currentConfig = {
            bgUrl: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920',
            blur: '20px',
            glassBg: 'rgba(255, 255, 255, 0.06)',
            glassBorder: 'rgba(255, 255, 255, 0.15)',
            textColor: '#ffffff',
            btnBg: '#000000'
        };

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function updateBg(url) {
            currentConfig.bgUrl = url;
            document.documentElement.style.setProperty('--bg-image', `url('${url}')`);
        }

        function updateGlass() {
            const blur = document.getElementById('blurInput').value;
            const bgColor = document.getElementById('bgColorInput').value;
            const opacity = document.getElementById('opacityInput').value;
            const borderAlpha = document.getElementById('borderInput').value;

            document.getElementById('blurVal').innerText = blur + 'px';
            document.getElementById('opacityVal').innerText = opacity;
            document.getElementById('borderVal').innerText = borderAlpha;

            currentConfig.blur = blur + 'px';
            currentConfig.glassBg = hexToRgba(bgColor, opacity);
            currentConfig.glassBorder = hexToRgba('#ffffff', borderAlpha);

            document.documentElement.style.setProperty('--glass-blur', currentConfig.blur);
            document.documentElement.style.setProperty('--glass-bg', currentConfig.glassBg);
            document.documentElement.style.setProperty('--glass-border', currentConfig.glassBorder);
        }

        function updateText() {
            const textColor = document.getElementById('textColorInput').value;
            currentConfig.textColor = textColor;

            document.documentElement.style.setProperty('--text-color', textColor);
            document.documentElement.style.setProperty('--text-muted', hexToRgba(textColor, 0.6));
            document.documentElement.style.setProperty('--input-border', hexToRgba(textColor, 0.4));
        }

        function updateBtn() {
            const btnColor = document.getElementById('btnColorInput').value;
            currentConfig.btnBg = btnColor;
            document.documentElement.style.setProperty('--btn-bg', btnColor);
        }

        // ==========================================
        // 彈出視窗控制與資料串接
        // ==========================================
        function openExportModal() {
            // 生成整齊的 CSS 變數格式字串
            const cssString = `:root {\n` +
                `    --bg-image: url('${currentConfig.bgUrl}');\n` +
                `    --glass-bg: ${currentConfig.glassBg};\n` +
                `    --glass-blur: ${currentConfig.blur};\n` +
                `    --glass-border: ${currentConfig.glassBorder};\n` +
                `    --text-color: ${currentConfig.textColor};\n` +
                `    --btn-bg: ${currentConfig.btnBg};\n` +
                `}`;
            
            // 寫入到 Code 區塊
            document.getElementById('codeOutput').innerText = cssString;
            
            // 顯示彈窗
            document.getElementById('exportModal').classList.add('active');
            document.getElementById('copyBtn').innerText = "複製到剪貼簿";
        }

        function closeExportModal() {
            document.getElementById('exportModal').classList.remove('active');
        }

        function copyToClipboard() {
            const codeText = document.getElementById('codeOutput').innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                document.getElementById('copyBtn').innerText = "✅ 已成功複製！";
            }).catch(err => {
                alert("複製失敗，請手動全選複製。");
            });
        }
    </script>
</body>
</html>
