<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛玻璃極致自定義面板 - 15款背景特調</title>
    <style>
        /* ==========================================
           1. 基礎核心樣式與預設變數
           ========================================== */
        :root {
            --bg-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920');
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-blur: 20px;
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: rgba(0, 0, 0, 0.2);
            --text-color: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --input-border: rgba(255, 255, 255, 0.4);
            --btn-bg: #000000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            padding-left: 320px; /* 為左側控制面板留出空間 */
            transition: background-image 0.5s ease;
        }

        /* ==========================================
           2. 控制面板樣式 (左側側邊欄)
           ========================================== */
        .control-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 300px;
            height: 100vh;
            background: rgba(20, 20, 20, 0.95);
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 20px;
            color: #fff;
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .control-panel h3 {
            font-size: 1.1rem;
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            color: #007bff;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 0.85rem;
            color: #ccc;
            margin-bottom: 8px;
        }

        .control-group label span {
            float: right;
            color: #007bff;
            font-weight: bold;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: #007bff;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 35px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: transparent;
        }

        .control-group select {
            width: 100%;
            padding: 10px;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
        }
        
        .control-group select optgroup {
            background: #1a1a1a;
            color: #007bff;
            font-style: normal;
            font-weight: bold;
        }

        /* ==========================================
           3. 登入主畫面結構 (套用 CSS 變數)
           ========================================== */
        .main-container {
            width: 90%;
            max-width: 900px;
            min-height: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3rem;
            
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            box-shadow: 0 20px 50px var(--glass-shadow);
            
            color: var(--text-color);
            transition: border 0.3s, background-color 0.3s;
        }

        .content-section {
            flex: 1;
            padding-right: 2rem;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 2.5rem;
        }

        .content-section h1 {
            font-size: 2.8rem;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        .content-section p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .login-card {
            width: 340px;
            padding: 2.5rem 2rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
        }

        .login-card h2 {
            margin-bottom: 1.5rem;
            font-size: 1.3rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: transparent;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-color);
            outline: none;
        }

        .input-group input::placeholder {
            color: var(--text-muted);
        }

        .forgot-link {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .submit-btn {
            width: 100%;
            padding: 0.8rem;
            background: var(--btn-bg);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <h3>毛玻璃自定義面板</h3>

        <div class="control-group">
            <label>1. 選擇背景底圖 (15款)</label>
            <select id="bgSelect" onchange="updateBg(this.value)">
                
                <optgroup label="✨ 流線 & 幾何幾何 (適合現代感)">
                    <option value="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920">01. 絲綢白流線 (預設)</option>
                    <option value="https://images.unsplash.com/photo-1614064641938-3bbee52942c7?q=80&w=1920">02. 暗黑科技幾何</option>
                    <option value="https://images.unsplash.com/photo-1502239608882-93b729c6af43?q=80&w=1920">03. 金屬絲滑灰</option>
                </optgroup>

                <optgroup label="🎨 炫彩 & 流體 (層次最豐富)">
                    <option value="https://images.unsplash.com/photo-1557672172-298e090bd0f1?q=80&w=1920">04. 夢幻炫彩流體</option>
                    <option value="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?q=80&w=1920">05. 3D 霓虹波浪</option>
                    <option value="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=1920">06. 漸層彩虹微光</option>
                </optgroup>

                <optgroup label="🌌 大自然 & 星空 (深邃質感)">
                    <option value="https://images.unsplash.com/photo-1531366936337-7c912a4589a7?q=80&w=1920">07. 挪威極光冰川</option>
                    <option value="https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?q=80&w=1920">08. 深空繁星銀河</option>
                    <option value="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1920">09. 黃昏暮色海灘</option>
                </optgroup>

                <optgroup label="🏢 現代建築 & 工業風 (極簡乾淨)">
                    <option value="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1920">10. 明亮現代光影</option>
                    <option value="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=1920">11. 都市玻璃摩天大樓</option>
                    <option value="https://images.unsplash.com/photo-1541888946425-d81bb19240f5?q=80&w=1920">12. 清水模清水混凝土</option>
                </optgroup>

                <optgroup label="🌸 唯美 & 抽象 (文青柔和)">
                    <option value="https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17?q=80&w=1920">13. 抽象水彩暈染</option>
                    <option value="https://images.unsplash.com/photo-1490750967868-88aa4486c946?q=80&w=1920">14. 春日朦朧繁花</option>
                    <option value="https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?q=80&w=1920">15. 綠意光影植物</option>
                </optgroup>
                
            </select>
        </div>

        <div class="control-group">
            <label>2. 磨砂模糊度 (Blur): <span id="blurVal">20px</span></label>
            <input type="range" id="blurInput" min="0" max="50" value="20" oninput="updateGlass()">
        </div>

        <div class="control-group">
            <label>3. 玻璃基調顏色</label>
            <input type="color" id="bgColorInput" value="#ffffff" oninput="updateGlass()">
        </div>
        <div class="control-group">
            <label>4. 玻璃透明度 (Opacity): <span id="opacityVal">0.06</span></label>
            <input type="range" id="opacityInput" min="0" max="1" step="0.01" value="0.06" oninput="updateGlass()">
        </div>

        <div class="control-group">
            <label>5. 邊框反光亮度 (Border Alpha): <span id="borderVal">0.15</span></label>
            <input type="range" id="borderInput" min="0" max="1" step="0.01" value="0.15" oninput="updateGlass()">
        </div>

        <div class="control-group">
            <label>6. 主文字顏色</label>
            <input type="color" id="textColorInput" value="#ffffff" oninput="updateText()">
        </div>

        <div class="control-group">
            <label>7. Submit按鈕顏色</label>
            <input type="color" id="btnColorInput" value="#000000" oninput="updateBtn()">
        </div>
    </div>

    <div class="main-container">
        <div class="content-section">
            <div class="brand">Brand Name</div>
            <h1>Malesuada<br>Fermentum<br>Tortor</h1>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
        </div>

        <div class="login-card">
            <h2>Login</h2>
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" required>
                </div>
                <a href="#" class="forgot-link">Forgot password ?</a>
                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>

    <script>
        // 十六進位轉 RGBA 的輔助函式
        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // 更換背景圖
        function updateBg(url) {
            document.documentElement.style.setProperty('--bg-image', `url('${url}')`);
        }

        // 動態更新毛玻璃核心參數
        function updateGlass() {
            const blur = document.getElementById('blurInput').value;
            const bgColor = document.getElementById('bgColorInput').value;
            const opacity = document.getElementById('opacityInput').value;
            const borderAlpha = document.getElementById('borderInput').value;

            // 更新介面上的數值文字
            document.getElementById('blurVal').innerText = blur + 'px';
            document.getElementById('opacityVal').innerText = opacity;
            document.getElementById('borderVal').innerText = borderAlpha;

            // 核心：直接改寫 CSS 變數
            document.documentElement.style.setProperty('--glass-blur', blur + 'px');
            document.documentElement.style.setProperty('--glass-bg', hexToRgba(bgColor, opacity));
            document.documentElement.style.setProperty('--glass-border', hexToRgba('#ffffff', borderAlpha));
        }

        // 動態更新文字與輸入框
        function updateText() {
            const textColor = document.getElementById('textColorInput').value;
            document.documentElement.style.setProperty('--text-color', textColor);
            document.documentElement.style.setProperty('--text-muted', hexToRgba(textColor, 0.6));
            document.documentElement.style.setProperty('--input-border', hexToRgba(textColor, 0.4));
        }

        // 動態更新按鈕顏色
        function updateBtn() {
            const btnColor = document.getElementById('btnColorInput').value;
            document.documentElement.style.setProperty('--btn-bg', btnColor);
        }
    </script>
</body>
</html>
